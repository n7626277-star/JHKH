name: Check Email and Send AI Image

on:
  schedule:
    # רץ כל 10 דקות. אפשר לשנות ל-*/15 או */30 כדי לחסוך דקות ריצה בריפו פרטי
    - cron: '*/10 * * * *'
  workflow_dispatch: {}

jobs:
  check-and-send:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install
        working-directory: scripts

      - name: Check inbox and send generated images
        working-directory: scripts
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: node check-and-send.js
